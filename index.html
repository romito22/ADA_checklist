<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADA Restroom Inspection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      color: #0f3fb8;
      font-size: 2.35rem;
      line-height: 1.1;
    }

    #description {
      display: none;
    }

    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 24px;
    }

    .resource-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 12px;
      background: #edf3ff;
      color: #0f3fb8;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #cfe0ff;
      transition: .18s ease;
    }

    .resource-link:hover {
      background: #dfeaff;
      border-color: #aecaFF;
    }

    .meta {
      background: #f8f9fc;
      padding: 20px;
      border-radius: 14px;
      margin: 25px 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 220px;
    }

    .meta-field label {
      font-weight: 900;
      margin-bottom: 8px;
      color: #1e5eff;
      font-size: 1rem;
    }

    input,
    select,
    textarea {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #c8d0e0;
      font-size: 15px;
      background: #fff;
      color: #111;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8b93a7;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1e5eff;
      box-shadow: 0 0 0 3px rgba(30, 94, 255, 0.14);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #1e5eff 50%),
                        linear-gradient(135deg, #1e5eff 50%, transparent 50%);
      background-position: calc(100% - 20px) calc(50% - 3px),
                           calc(100% - 14px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 42px;
      cursor: pointer;
    }

    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }

    #submitBtn {
      background: #000;
      color: #fff;
    }

    #resetBtn {
      background: #ddd;
      color: #111;
    }

    #preview {
      display: none;
      margin-top: 25px;
      background: #efefef;
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      white-space: pre-wrap;
      font-size: 12px;
    }

    button.resource-link {
      font-size: 16px;
      font-weight: 700;
      padding: 10px 16px;
      border: 1px solid #cfe0ff;
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      border-bottom: 2px solid #e6eaf3;
      margin: 4px 0 22px;
    }

    .tab {
      background: none;
      color: #5b657a;
      border-radius: 10px 10px 0 0;
      padding: 10px 18px;
      font-size: 15px;
      border-bottom: 3px solid transparent;
      margin-bottom: -2px;
    }

    .tab:hover {
      background: #f1f5ff;
      color: #0f3fb8;
    }

    .tab.active {
      background: #edf3ff;
      color: #0f3fb8;
      border-bottom-color: #1e5eff;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .status-note {
      font-size: 13px;
      font-weight: 700;
      color: #5b657a;
      margin: 0 0 14px;
    }

    .status-note.error {
      color: #b3261e;
    }

    /* ---------- Progress bars ---------- */
    .bar {
      height: 12px;
      background: #e6eaf3;
      border-radius: 999px;
      overflow: hidden;
    }

    .bar > span {
      display: block;
      height: 100%;
      background: #1e5eff;
      border-radius: 999px;
      transition: width .4s ease;
    }

    .bar.complete > span { background: #1b9a4a; }
    .bar.progress > span { background: #e0a100; }
    .bar.none > span { background: #c8d0e0; }
    .bar.big { height: 22px; }

    .stack {
      display: flex;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      background: #e6eaf3;
    }

    .stack .y { background: #1b9a4a; }
    .stack .n { background: #d93025; }
    .stack .a { background: #b6bfd1; }

    /* ---------- Dashboard ---------- */
    .kpis {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
      gap: 12px;
      margin-bottom: 8px;
    }

    .kpi {
      background: #f8f9fc;
      border: 1px solid #e6eaf3;
      border-radius: 14px;
      padding: 14px 16px;
    }

    .kpi.total {
      grid-column: 1 / -1;
    }

    .kpi .label {
      font-size: 12px;
      font-weight: 800;
      color: #5b657a;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .kpi .value {
      font-size: 1.9rem;
      font-weight: 900;
      color: #0f3fb8;
      margin: 4px 0 8px;
    }

    .kpi .sub {
      font-size: 13px;
      color: #5b657a;
      margin-top: 8px;
    }

    .section-title {
      margin: 26px 0 8px;
      color: #1e3fb8;
      font-size: 1.1rem;
    }

    .legend {
      display: flex;
      gap: 16px;
      font-size: 12px;
      font-weight: 700;
      color: #5b657a;
      margin-bottom: 4px;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 5px;
    }

    .floor-row,
    .room-row {
      display: grid;
      align-items: center;
      gap: 14px;
      padding: 9px 0;
      border-bottom: 1px solid #eef1f7;
      font-size: 14px;
    }

    .floor-row {
      grid-template-columns: 110px 1fr 130px;
    }

    .room-row {
      grid-template-columns: 190px 1fr 56px 170px 110px;
    }

    .room-row .name {
      font-weight: 800;
    }

    .room-row .name small {
      display: block;
      font-weight: 400;
      color: #5b657a;
      font-size: 12px;
    }

    .room-row .pct {
      font-weight: 900;
      text-align: right;
    }

    .floor-row .meta-text {
      font-size: 13px;
      color: #5b657a;
      text-align: right;
    }

    /* ---------- Tags ---------- */
    .tag {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
      background: #eceff5;
      color: #3b4a6b;
    }

    .tag.men { background: #dbe8ff; color: #0f3fb8; }
    .tag.women { background: #ffe0ef; color: #a1175f; }
    .tag.other { background: #dff5e6; color: #17633a; }
    .tag.complete { background: #dff5e6; color: #17633a; }
    .tag.progress { background: #fff0c7; color: #7a5200; }
    .tag.none { background: #eceff5; color: #4b556b; }

    /* ---------- Database ---------- */
    .db-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .db-toolbar select,
    .db-toolbar input[type="search"] {
      padding: 8px 10px;
      font-size: 14px;
    }

    .db-toolbar select {
      padding-right: 32px;
    }

    .db-toolbar input[type="search"] {
      min-width: 200px;
    }

    .seg {
      display: inline-flex;
      border: 1.5px solid #c8d0e0;
      border-radius: 10px;
      overflow: hidden;
    }

    .seg button {
      background: #fff;
      color: #3b4a6b;
      border-radius: 0;
      padding: 8px 14px;
      font-size: 14px;
    }

    .seg button.on {
      background: #1e5eff;
      color: #fff;
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 14px;
      background: #000;
      color: #fff;
    }

    .btn-sm.secondary {
      background: #ddd;
      color: #111;
    }

    .db-new {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      background: #f8f9fc;
      border: 1px solid #e6eaf3;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }

    .db-new[hidden] { display: none; }

    .db-new input,
    .db-new select {
      padding: 8px 10px;
      font-size: 14px;
    }

    .db-new select { padding-right: 32px; }

    .db-table-wrap {
      overflow-x: auto;
    }

    table.db-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .db-table th {
      text-align: left;
      padding: 8px;
      color: #5b657a;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-bottom: 2px solid #e6eaf3;
      white-space: nowrap;
    }

    .db-table td {
      padding: 3px 4px;
      border-bottom: 1px solid #eef1f7;
      vertical-align: middle;
    }

    .db-table td input[type="text"] {
      width: 100%;
      padding: 6px 8px;
      font-size: 14px;
      border: 1.5px solid transparent;
      background: transparent;
      border-radius: 6px;
      box-shadow: none;
    }

    .db-table td input[type="text"]:hover:not(:disabled) {
      background: #f4f6fb;
    }

    .db-table td input[type="text"]:focus {
      background: #fff;
      border-color: #1e5eff;
    }

    .db-table td.c-room input { min-width: 90px; font-weight: 800; }
    .db-table td.c-floor input { width: 54px; }
    .db-table td.c-type input { min-width: 180px; }
    .db-table td.c-notes input { min-width: 200px; }
    .db-table td.c-prog { min-width: 130px; }
    .db-table td.c-prog .pct { font-size: 12px; font-weight: 800; color: #3b4a6b; margin-bottom: 3px; }
    .db-table td.c-done { text-align: center; }
    .db-table td.c-status { white-space: nowrap; padding: 3px 8px; }
    .db-table td.c-state { font-size: 12px; font-weight: 700; white-space: nowrap; color: #5b657a; padding: 3px 8px; }
    .db-table td.c-state.ok { color: #1b7a3a; }
    .db-table td.c-state.error { color: #b3261e; }

    .db-table tr.group td {
      background: #f1f4fb;
      font-weight: 900;
      color: #1e3fb8;
      padding: 8px;
    }

    .board {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      align-items: flex-start;
      padding-bottom: 8px;
    }

    .board[hidden] { display: none; }

    .board .col {
      min-width: 240px;
      flex: 1;
      background: #f4f6fb;
      border-radius: 12px;
      padding: 10px;
    }

    .board .col h4 {
      margin: 2px 4px 8px;
      color: #1e3fb8;
      font-size: 14px;
    }

    .board .card {
      background: #fff;
      border: 1px solid #e6eaf3;
      border-radius: 10px;
      padding: 10px 12px;
      margin-top: 8px;
    }

    .board .card .room {
      font-weight: 900;
      margin-bottom: 6px;
    }

    .board .card .row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .board .card .note {
      font-size: 12px;
      color: #5b657a;
      margin-top: 8px;
    }

    @media (max-width: 900px) {
      .room-row {
        grid-template-columns: 1fr 52px 104px;
        gap: 8px 12px;
      }

      .room-row .name { order: 1; }
      .room-row .pct { order: 2; }
      .room-row .tag { order: 3; justify-self: end; }
      .room-row .bar { order: 4; grid-column: 1 / -1; }
      .room-row .stack { order: 5; grid-column: 1 / -1; }

      .floor-row {
        grid-template-columns: 70px 1fr 110px;
      }
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .container {
        padding: 22px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title">ADA Restroom Accessibility Inspection</h1>
    <p id="description"></p>

    <div class="resource-links">
      <a
        class="resource-link"
        href="https://docs.google.com/spreadsheets/d/1GLxfyx65D8W94cdcY2W9scA3eZ_7jMYfd3PzWFIRbnM/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Google Sheet
      </a>

      <a
        class="resource-link"
        href="https://drive.google.com/file/d/1aChsj8vlbDjdQJ3nxck4Cjoe4AA0aQdv/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Pictures &amp; PDF
      </a>
    </div>

    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="dashboard" type="button">Dashboard</button>
      <button class="tab" role="tab" data-tab="survey" type="button">Survey</button>
      <button class="tab" role="tab" data-tab="database" type="button">Restrooms</button>
    </nav>

    <section id="panel-dashboard" class="panel" role="tabpanel">
      <p id="dashStatus" class="status-note">Loading…</p>
      <div id="kpis" class="kpis"></div>

      <h3 class="section-title">Progress by floor</h3>
      <div id="floorBars"></div>

      <h3 class="section-title">Progress by restroom</h3>
      <div class="legend">
        <span><i style="background:#1b9a4a"></i>Yes</span>
        <span><i style="background:#d93025"></i>No</span>
        <span><i style="background:#b6bfd1"></i>N/A</span>
        <span>(bar = questions answered out of the full survey)</span>
      </div>
      <div id="roomBars"></div>
    </section>

    <section id="panel-database" class="panel" role="tabpanel">
      <p id="dbStatus" class="status-note">Loading…</p>

      <div class="db-toolbar">
        <div class="seg" id="dbViews">
          <button type="button" data-view="table" class="on">Table</button>
          <button type="button" data-view="board">Board</button>
        </div>
        <input id="dbSearch" type="search" placeholder="Search room, type, notes…">
        <select id="dbType" title="Type">
          <option value="all">All types</option>
          <option value="men">Men</option>
          <option value="women">Women</option>
          <option value="other">Other</option>
        </select>
        <select id="dbFloor" title="Floor"><option value="all">All floors</option></select>
        <select id="dbStatusFilter" title="Status">
          <option value="all">All statuses</option>
          <option value="Complete">Complete</option>
          <option value="In progress">In progress</option>
          <option value="Not started">Not started</option>
        </select>
        <select id="dbSort" title="Sort">
          <option value="floor">Sort: floor</option>
          <option value="room">Sort: room</option>
          <option value="type">Sort: type</option>
          <option value="progress">Sort: progress</option>
          <option value="status">Sort: status</option>
        </select>
        <select id="dbGroup" title="Group by">
          <option value="floor">Group: floor</option>
          <option value="type">Group: type</option>
          <option value="status">Group: status</option>
          <option value="none">No grouping</option>
        </select>
        <button id="dbAdd" class="btn-sm" type="button">+ New</button>
      </div>

      <div id="dbNew" class="db-new" hidden>
        <select id="newFloor" title="Floor"></select>
        <input id="newRoom" type="text" placeholder="Room (e.g. 1117)">
        <input id="newType" type="text" list="typeOptions" placeholder="Type (e.g. Men's Restroom)">
        <datalist id="typeOptions"></datalist>
        <button id="newSave" class="btn-sm" type="button">Add</button>
        <button id="newCancel" class="btn-sm secondary" type="button">Cancel</button>
      </div>

      <div id="dbTableWrap" class="db-table-wrap">
        <table class="db-table">
          <thead>
            <tr>
              <th>Room</th>
              <th>Floor</th>
              <th>Type</th>
              <th>Status</th>
              <th>Progress</th>
              <th>Done</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="dbBody"></tbody>
        </table>
      </div>

      <div id="dbBoard" class="board" hidden></div>
    </section>

    <section id="panel-survey" class="panel" role="tabpanel">
    <div class="meta">
      <div class="meta-field">
        <label for="floorSelect">Floor (1–6)</label>
        <select id="floorSelect">
          <option value="">Select...</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>

      <div class="meta-field">
        <label for="roomInput">Room / Area</label>
        <input id="roomInput" type="text" placeholder="e.g. WC 101">
      </div>

      <div class="meta-field">
        <label for="restroomType">Restroom Type</label>
        <select id="restroomType">
          <option value="">Select...</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Family">Family</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>
    </div>

    <form id="form"></form>

    <div class="button-group">
      <button id="resetBtn" type="button">Reset</button>
      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div id="preview"></div>
    </section>
  </div>

  <script src="./app.js"></script>
  <script src="./dashboard.js"></script>
</body>
</html>
