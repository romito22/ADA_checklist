<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADA Restroom Inspection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      color: #0f3fb8;
      font-size: 2.35rem;
      line-height: 1.1;
    }

    #description {
      display: none;
    }

    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 24px;
    }

    .resource-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 12px;
      background: #edf3ff;
      color: #0f3fb8;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #cfe0ff;
      transition: .18s ease;
    }

    .resource-link:hover {
      background: #dfeaff;
      border-color: #aecaFF;
    }

    .meta {
      background: #f8f9fc;
      padding: 20px;
      border-radius: 14px;
      margin: 25px 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 220px;
    }

    .meta-field label {
      font-weight: 900;
      margin-bottom: 8px;
      color: #1e5eff;
      font-size: 1rem;
    }

    input,
    select,
    textarea {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #c8d0e0;
      font-size: 15px;
      background: #fff;
      color: #111;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8b93a7;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1e5eff;
      box-shadow: 0 0 0 3px rgba(30, 94, 255, 0.14);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #1e5eff 50%),
                        linear-gradient(135deg, #1e5eff 50%, transparent 50%);
      background-position: calc(100% - 20px) calc(50% - 3px),
                           calc(100% - 14px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 42px;
      cursor: pointer;
    }

    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }

    #submitBtn {
      background: #000;
      color: #fff;
    }

    #resetBtn {
      background: #ddd;
      color: #111;
    }

    #preview {
      margin-top: 25px;
      background: #efefef;
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      white-space: pre-wrap;
      font-size: 12px;
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .container {
        padding: 22px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title">ADA Restroom Accessibility Inspection</h1>
    <p id="description"></p>

    <div class="resource-links">
      <a
        class="resource-link"
        href="https://docs.google.com/spreadsheets/d/1GLxfyx65D8W94cdcY2W9scA3eZ_7jMYfd3PzWFIRbnM/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Google Sheet
      </a>

      <a
        class="resource-link"
        href="https://drive.google.com/file/d/1aChsj8vlbDjdQJ3nxck4Cjoe4AA0aQdv/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Pictures &amp; PDF
      </a>
    </div>

    <div class="meta">
      <div class="meta-field">
        <label for="floorSelect">Floor (1–6)</label>
        <select id="floorSelect">
          <option value="">Select...</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>

      <div class="meta-field">
        <label for="roomInput">Room / Area</label>
        <input id="roomInput" type="text" placeholder="e.g. WC 101">
      </div>

      <div class="meta-field">
        <label for="restroomType">Restroom Type</label>
        <select id="restroomType">
          <option value="">Select...</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Family">Family</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>
    </div>

    <form id="form"></form>

    <div class="button-group">
      <button id="resetBtn" type="button">Reset</button>
      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div id="preview"></div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
