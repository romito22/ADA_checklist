<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADA Checklist</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 24px;
      border-radius: 14px;
      box-shadow: 0 4px 12px rgba(0,0,0,.1);
    }

    h1 {
      margin-bottom: 4px;
      color: #0f3fb8;
    }

    .meta {
      background: #f8f9fb;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 20px;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      min-width: 220px;
      flex: 1;
    }

    .meta-field label {
      font-weight: bold;
      margin-bottom: 6px;
      color: #1e5eff;
    }

    input, select {
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #preview {
      margin-top: 20px;
      background: #eee;
      padding: 10px;
      border-radius: 8px;
      font-family: monospace;
      white-space: pre-wrap;
    }

    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    #submitBtn {
      background: black;
      color: white;
    }

    #resetBtn {
      background: #ddd;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title"></h1>
    <p id="description"></p>

    <!-- META INFO -->
    <div class="meta">
      <div class="meta-field">
        <label for="floorSelect">Floor (1–6)</label>
        <select id="floorSelect">
          <option value="">Select...</option>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
          <option>5</option>
          <option>6</option>
        </select>
      </div>

      <div class="meta-field">
        <label for="roomInput">Room / Area</label>
        <input id="roomInput" type="text" placeholder="e.g. WC 101" />
      </div>

      <div class="meta-field">
        <label for="restroomType">Restroom Type</label>
        <select id="restroomType">
          <option value="">Select...</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Family">Family</option>
        </select>
      </div>
    </div>

    <!-- FORM -->
    <form id="form"></form>

    <div class="button-group">
      <button id="resetBtn" type="button">Reset</button>
      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div id="preview"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
