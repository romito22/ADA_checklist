<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accessibility Checklist</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f4f4; padding:40px; }
    .container { max-width: 900px; margin:auto; background:#fff; padding:24px; border-radius:10px; box-shadow:0 4px 12px rgba(0,0,0,.1); }
    h1 { margin:0 0 6px; }
    p { margin:0 0 16px; color:#555; }
    .question-block { margin: 18px 0; padding: 14px 0 18px; border-bottom:1px solid #ddd; }
    .label { font-weight:700; margin-bottom:8px; }
    .help { font-size:14px; color:#555; margin:6px 0 10px; }
    .radio-group { margin: 10px 0 12px; display:flex; gap:18px; flex-wrap:wrap; }
    .solutions { background:#fff4f4; padding:12px; border-left:4px solid #d00; margin-top:10px; display:none; }
    textarea { width:100%; padding:8px; margin-top:8px; min-height:80px; }
    .refimg { max-width:220px; display:block; margin-top:10px; border:1px solid #ddd; border-radius:8px; }
    .actions { display:flex; gap:10px; justify-content:flex-end; margin-top:16px; }
    button { padding:10px 16px; font-weight:700; border-radius:8px; border:1px solid #222; cursor:pointer; }
    #submitBtn { background:#111; color:#fff; }
    #resetBtn { background:#fff; color:#111; }
    .preview { margin-top: 22px; background:#eee; padding:14px; font-family: monospace; white-space: pre-wrap; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title"></h1>
    <p id="description"></p>

    <form id="form"></form>

    <div class="actions">
      <button id="resetBtn" type="button">Reset</button>
      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div class="preview" id="preview"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
