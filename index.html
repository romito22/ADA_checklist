<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADA Restroom Inspection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 40px;
      color: #111;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
    }

    h1 {
      margin: 0;
      color: #0f3fb8;
      font-size: 2.35rem;
      line-height: 1.1;
    }

    #description {
      display: none;
    }

    .resource-links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 24px;
    }

    .resource-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      border-radius: 12px;
      background: #edf3ff;
      color: #0f3fb8;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #cfe0ff;
      transition: .18s ease;
    }

    .resource-link:hover {
      background: #dfeaff;
      border-color: #aecaFF;
    }

    .meta {
      background: #f8f9fc;
      padding: 20px;
      border-radius: 14px;
      margin: 25px 0;
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }

    .meta-field {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 220px;
    }

    .meta-field label {
      font-weight: 900;
      margin-bottom: 8px;
      color: #1e5eff;
      font-size: 1rem;
    }

    input,
    select,
    textarea {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1.5px solid #c8d0e0;
      font-size: 15px;
      background: #fff;
      color: #111;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    input::placeholder,
    textarea::placeholder {
      color: #8b93a7;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: none;
      border-color: #1e5eff;
      box-shadow: 0 0 0 3px rgba(30, 94, 255, 0.14);
    }

    select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #1e5eff 50%),
                        linear-gradient(135deg, #1e5eff 50%, transparent 50%);
      background-position: calc(100% - 20px) calc(50% - 3px),
                           calc(100% - 14px) calc(50% - 3px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
      padding-right: 42px;
      cursor: pointer;
    }

    .button-group {
      margin-top: 30px;
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }

    button {
      padding: 10px 18px;
      border-radius: 10px;
      border: none;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
    }

    #submitBtn {
      background: #000;
      color: #fff;
    }

    #resetBtn {
      background: #ddd;
      color: #111;
    }

    #preview {
      display: none;
      margin-top: 25px;
      background: #efefef;
      padding: 15px;
      border-radius: 12px;
      font-family: monospace;
      white-space: pre-wrap;
      font-size: 12px;
    }

    button.resource-link {
      font-size: 16px;
      font-weight: 700;
      padding: 10px 16px;
      border: 1px solid #cfe0ff;
    }

    /* ---------- Restroom list modal ---------- */
    #restroomModal {
      position: fixed;
      inset: 0;
      background: rgba(15, 25, 50, 0.55);
      display: none;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 12px;
      overflow-y: auto;
      z-index: 50;
    }

    #restroomModal.open {
      display: flex;
    }

    .rl-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 980px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .rl-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .rl-header h2 {
      margin: 0;
      color: #1e3fb8;
      font-size: 1.4rem;
    }

    #rlClose {
      background: #ddd;
      color: #111;
    }

    .rl-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      background: #f8f9fc;
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .rl-controls label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 800;
      font-size: 13px;
      color: #1e5eff;
    }

    .rl-controls label.rl-check {
      flex-direction: row;
      align-items: center;
      gap: 8px;
      padding-bottom: 10px;
    }

    .rl-controls select {
      padding: 8px 36px 8px 10px;
      font-size: 14px;
    }

    #rlStatus {
      font-size: 13px;
      font-weight: 700;
      color: #5b657a;
      margin: 0 0 10px;
    }

    #rlStatus.error {
      color: #b3261e;
    }

    .rl-table-wrap {
      overflow-x: auto;
    }

    table.rl-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .rl-table th {
      text-align: left;
      padding: 8px;
      background: #edf3ff;
      color: #0f3fb8;
      white-space: nowrap;
    }

    .rl-table td {
      padding: 4px;
      border-bottom: 1px solid #e6eaf3;
      vertical-align: middle;
    }

    .rl-table td input[type="text"] {
      width: 100%;
      padding: 7px 8px;
      font-size: 14px;
      border-radius: 8px;
    }

    .rl-table td.rl-floor input { width: 56px; }
    .rl-table td.rl-room input { width: 96px; }
    .rl-table td.rl-type input { min-width: 190px; }
    .rl-table td.rl-notes input { min-width: 200px; }

    .rl-table td.rl-cat {
      white-space: nowrap;
      font-weight: 700;
      color: #3b4a6b;
      padding: 4px 8px;
    }

    .rl-table td.rl-done {
      text-align: center;
    }

    .rl-table td.rl-state {
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
      color: #5b657a;
      padding: 4px 8px;
    }

    .rl-table td.rl-state.error { color: #b3261e; }
    .rl-table td.rl-state.ok { color: #1b7a3a; }

    .rl-table tr.rl-group td {
      background: #f1f4fb;
      font-weight: 900;
      color: #1e3fb8;
      padding: 8px;
    }

    @media (max-width: 700px) {
      body {
        padding: 18px;
      }

      .container {
        padding: 22px;
      }

      h1 {
        font-size: 1.9rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 id="title">ADA Restroom Accessibility Inspection</h1>
    <p id="description"></p>

    <div class="resource-links">
      <a
        class="resource-link"
        href="https://docs.google.com/spreadsheets/d/1GLxfyx65D8W94cdcY2W9scA3eZ_7jMYfd3PzWFIRbnM/edit?usp=sharing"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Google Sheet
      </a>

      <a
        class="resource-link"
        href="https://drive.google.com/file/d/1aChsj8vlbDjdQJ3nxck4Cjoe4AA0aQdv/view?usp=drivesdk"
        target="_blank"
        rel="noopener noreferrer"
      >
        Open Pictures &amp; PDF
      </a>

      <button id="restroomListBtn" class="resource-link" type="button">
        Restroom List
      </button>
    </div>

    <div class="meta">
      <div class="meta-field">
        <label for="floorSelect">Floor (1–6)</label>
        <select id="floorSelect">
          <option value="">Select...</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
        </select>
      </div>

      <div class="meta-field">
        <label for="roomInput">Room / Area</label>
        <input id="roomInput" type="text" placeholder="e.g. WC 101">
      </div>

      <div class="meta-field">
        <label for="restroomType">Restroom Type</label>
        <select id="restroomType">
          <option value="">Select...</option>
          <option value="Men">Men</option>
          <option value="Women">Women</option>
          <option value="Family">Family</option>
          <option value="Unisex">Unisex</option>
        </select>
      </div>
    </div>

    <form id="form"></form>

    <div class="button-group">
      <button id="resetBtn" type="button">Reset</button>
      <button id="submitBtn" type="button">Submit</button>
    </div>

    <div id="preview"></div>
  </div>

  <div id="restroomModal" aria-hidden="true">
    <div class="rl-card" role="dialog" aria-labelledby="rlTitle">
      <div class="rl-header">
        <h2 id="rlTitle">Restroom List</h2>
        <button id="rlClose" type="button">Close</button>
      </div>

      <div class="rl-controls">
        <label>
          Type
          <select id="rlType">
            <option value="all">All</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="other">Other (single, family, mother's room…)</option>
          </select>
        </label>

        <label>
          Floor
          <select id="rlFloor">
            <option value="all">All floors</option>
          </select>
        </label>

        <label>
          Sort by
          <select id="rlSort">
            <option value="floor">Floor, then room</option>
            <option value="type">Type, then floor</option>
            <option value="room">Room</option>
            <option value="sheet">Sheet order</option>
          </select>
        </label>

        <label class="rl-check">
          <input id="rlGroup" type="checkbox" checked>
          Group by floor
        </label>
      </div>

      <p id="rlStatus">Loading…</p>

      <div class="rl-table-wrap">
        <table class="rl-table">
          <thead>
            <tr>
              <th>Floor</th>
              <th>Floor Category</th>
              <th>Room</th>
              <th>Restroom Type</th>
              <th>Done</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="rlBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="./app.js"></script>
  <script src="./restroom-list.js"></script>
</body>
</html>
